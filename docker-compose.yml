version: "3.9"

services:
  db:
    image: postgres:15
    container_name: truper-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: truper_platform
      POSTGRES_USER: truper_admin
      POSTGRES_PASSWORD: Truper123!
    ports:
      - "5433:5432"
    volumes:
      - truper_db_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truper-web
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 8088
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8088}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-truper_platform}
      DB_USER: ${DB_USER:-truper_admin}
      DB_PASSWORD: ${DB_PASSWORD:-Truper123!}
      DATABASE_URL: ${DATABASE_URL:-}
      AUTO_DB_INIT: "true"
    ports:
      - "8088:8088"
    volumes:
      - .:/var/www/html

volumes:
  truper_db_data:
