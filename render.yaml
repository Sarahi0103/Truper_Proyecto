# ==============================================================================
# RENDER BLUEPRINT - PLATAFORMA FERRETERÍA
# ==============================================================================
# Este archivo define la infraestructura en Render (Web + Base de Datos PostgreSQL)
# Al conectar el repositorio a Render mediante "New +" -> "Blueprint" o despliegue automático,
# Render configurará automáticamente todos estos recursos sin errores.
# ==============================================================================

databases:
  - name: ferreteria-db
    databaseName: ferreteria_platform
    user: ferreteria_admin
    region: oregon
    plan: free
    ipAllowList: []

services:
  - type: web
    name: Ferreteria
    env: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health.php

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: AUTO_DB_INIT
        value: "true"
      - key: LOG_TO_ERROR_LOG
        value: "true"

      # URL pública asignada por Render
      - key: APP_URL
        value: https://ferreteria-mmiz.onrender.com

      # Teléfono WhatsApp para atención al cliente y pedidos
      - key: COMPANY_WHATSAPP_PHONE
        value: "3312482297"

      # Conexión automática con la base de datos PostgreSQL
      - key: DB_HOST
        fromDatabase:
          name: ferreteria-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ferreteria-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: ferreteria-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: ferreteria-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: ferreteria-db
          property: database
      - key: DATABASE_URL
        fromDatabase:
          name: ferreteria-db
          property: connectionString

      # Claves de sesión seguras generadas por Render
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # Pasarelas de Pago y Facturación (Configurables en Dashboard de Render)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: FACTURAPI_API_KEY
        sync: false

